<!doctype html>
<html lang="en" style="background:#F2F4F7;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ripple Boulder" />
    <meta name="theme-color" content="#F2F4F7" />
    <title>Ripple Boulder</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: #F2F4F7; width: 100%; min-height: 100%; }
      #root { width: 100%; min-height: 100vh; background: #F2F4F7; }
      #fallback { display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; gap: 16px; padding: 24px; text-align: center; font-family: system-ui, sans-serif; }
      #fallback h2 { color: #1A5F6A; font-size: 22px; }
      #fallback p { color: #555; font-size: 14px; max-width: 300px; line-height: 1.6; }
      #fallback a { color: #1A5F6A; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="fallback">
        <img src="/logo.svg" style="height:60px;opacity:0.8;" />
        <h2>Ripple Boulder</h2>
        <p>Loading the app...</p>
        <p style="font-size:12px;color:#888;margin-top:8px;">If this takes more than 10 seconds, <a href="javascript:location.reload()">tap here to reload</a></p>
      </div>
    </div>
    <script>
      // Hide fallback once React loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          var f = document.getElementById('fallback');
          if (f && document.getElementById('root').children.length <= 1) {
            f.innerHTML = '<h2>Having trouble loading?</h2><p>Try reloading the page or check your internet connection.</p><br><a href="javascript:location.reload()" style="color:#1A5F6A;font-weight:bold;font-size:16px;">Reload App</a>';
          }
        }, 8000);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
